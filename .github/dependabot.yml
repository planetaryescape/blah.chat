version: 2
updates:
  # Bun workspace. Keep this at the repo root so Dependabot updates the
  # workspace-level bun.lock together with package manifests.
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    reviewers:
      - "bhekanik"
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore"
      include: "scope"
    # Expo / React Native packages must be bumped as a set via `expo install`
    # or an Expo SDK upgrade to keep native peer versions aligned. Allow patch
    # bumps, but block individual minor/major bumps that can desync the SDK.
    ignore:
      - dependency-name: "expo"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
      - dependency-name: "expo-*"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
      - dependency-name: "@expo/*"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
      - dependency-name: "react-native"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
      - dependency-name: "react-native-*"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
      - dependency-name: "@react-native-*/*"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
    groups:
      patch-updates:
        patterns:
          - "*"
        update-types:
          - "patch"

  # GitHub Actions updates
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "ci"
    labels:
      - "dependencies"
      - "ci"
