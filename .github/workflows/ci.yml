name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  lint-and-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify publishable packages have docs + publish config
        run: bun run package-docs:check

      - name: Run Biome check (lint + format)
        run: bun run lint

      - name: Verify BYOD schema in sync
        # --check: Regenerates schema without version bump to verify it matches committed files.
        # If drift detected, run 'bun run byod:sync --force' locally to regenerate.
        run: |
          bun run byod:sync --check
          if ! git diff --exit-code packages/byod-schema/; then
            echo "::error::BYOD schema is out of sync! Run 'bun run byod:sync --force' to regenerate."
            exit 1
          fi

      - name: Verify API client OpenAPI types are in sync
        run: |
          bun run api-client:generate
          if ! git diff --exit-code packages/api-client/src/generated/openapi.ts; then
            echo "::error::API client OpenAPI types are out of sync! Run 'bun run api-client:generate'."
            exit 1
          fi

      - name: Enforce API client version bump for contract/runtime changes
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch origin "$BASE_REF" --depth=1
          bun run api-client:version-check --base "origin/$BASE_REF"

      - name: Enforce desktop version sync
        run: bun run desktop:version-check

      - name: Enforce portable client boundaries
        run: bun run portable:check

      - name: Convex typecheck
        if: github.event.pull_request.user.login != 'dependabot[bot]'
        run: bun run deploy -- --dry-run --typecheck enable
        working-directory: packages/backend
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}

  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    environment: staging

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Convex types
        if: github.event.pull_request.user.login != 'dependabot[bot]'
        run: bun run generate
        working-directory: packages/backend
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}

      - name: Run tests
        run: bun run test:run

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, test]
    environment: staging

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build Next.js app
        run: bun run build
        env:
          NEXT_PUBLIC_CONVEX_URL: ${{ secrets.NEXT_PUBLIC_CONVEX_URL }}
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
