name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
  push:
    branches: [main]

# Workflow-level env so every job inherits cache + filter wiring.
# - TURBO_TOKEN/TURBO_TEAM enable Turborepo Remote Cache (Vercel). VERCEL_TOKEN is
#   reused as TURBO_TOKEN — they're the same kind of Vercel access token.
# - TURBO_FILTER scopes runs to packages affected since the PR base. On push to main
#   and workflow_dispatch it's empty, so the full graph runs (relying on cache to skip
#   unchanged work).
env:
  TURBO_TOKEN: ${{ secrets.VERCEL_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}
  TURBO_FILTER: ${{ github.event_name == 'pull_request' && format('--filter=...[origin/{0}]', github.base_ref) || '' }}

jobs:
  lint-and-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Fetch base ref for turbo affected filter
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: git fetch origin "$BASE_REF" --depth=1

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5

      - name: Cache Bun install dir
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Audit dependencies
        run: bun audit --prod --audit-level=high

      - name: Cache Turbo local artifacts
        uses: actions/cache@v6
        with:
          path: node_modules/.cache/turbo
          key: ${{ runner.os }}-turbo-lint-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-lint-
            ${{ runner.os }}-turbo-

      - name: Verify publishable packages have docs + publish config
        run: bun run package-docs:check

      - name: Run Biome check (lint + format)
        run: bun run lint -- $TURBO_FILTER

      - name: Verify API client OpenAPI types are in sync
        run: |
          bun run api-client:generate
          if ! git diff --exit-code packages/api-client/src/generated/openapi.ts; then
            echo "::error::API client OpenAPI types are out of sync! Run 'bun run api-client:generate'."
            exit 1
          fi

      - name: Enforce API client version bump for contract/runtime changes
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: bun run api-client:version-check --base "origin/$BASE_REF"

      - name: Verify Drizzle migrations are up-to-date with schema
        run: |
          bun run db:generate
          if [ -n "$(git status --porcelain packages/persistence-postgres/drizzle/)" ]; then
            echo "::error::Drizzle migrations are out of sync with schema! Run 'bun run db:generate' and commit the result."
            git status packages/persistence-postgres/drizzle/
            exit 1
          fi

      - name: Block residual Phase G/15 markers
        run: |
          if grep -RE 'Phase\s?(G|15)' apps/web/src; then
            echo "Residual Phase G/15 markers detected. The Convex to Postgres migration is complete; remove leftover TODOs."
            exit 1
          fi

  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    environment: staging

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Fetch base ref for turbo affected filter
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: git fetch origin "$BASE_REF" --depth=1

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5

      - name: Cache Bun install dir
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Cache Turbo local artifacts
        uses: actions/cache@v6
        with:
          path: node_modules/.cache/turbo
          key: ${{ runner.os }}-turbo-test-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-test-
            ${{ runner.os }}-turbo-

      - name: Run tests
        run: bun run test:run -- $TURBO_FILTER

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, test]
    environment: staging

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Fetch base ref for turbo affected filter
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: git fetch origin "$BASE_REF" --depth=1

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5

      - name: Cache Bun install dir
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Cache Turbo local artifacts
        uses: actions/cache@v6
        with:
          path: node_modules/.cache/turbo
          key: ${{ runner.os }}-turbo-build-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-build-
            ${{ runner.os }}-turbo-

      - name: Build
        run: bun run build -- $TURBO_FILTER
        env:
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}

  smoke:
    name: Smoke E2E (health + authenticated API)
    runs-on: ubuntu-latest
    needs: [build]
    environment: staging
    # Skipped on Dependabot PRs: GitHub does not expose environment secrets
    # to dependabot[bot]. The smoke probes a deployed URL anyway, so it
    # validates the live env, not the bump. The same job runs on push to main
    # after merge, catching deploy regressions.
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    # Required gate. PRs always run liveness smoke; authenticated smoke runs
    # when the low-privilege storage state secret is available. Push/manual
    # runs fail hard when required smoke config is missing.

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5

      - name: Cache Bun install dir
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Prepare smoke configuration
        working-directory: apps/web
        env:
          SMOKE_BASE_URL: ${{ secrets.SMOKE_BASE_URL }}
          SMOKE_AUTH_STORAGE_STATE_B64: ${{ secrets.SMOKE_AUTH_STORAGE_STATE_B64 }}
        run: |
          if [ -z "$SMOKE_BASE_URL" ]; then
            if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
              echo "::warning::Missing CI secret SMOKE_BASE_URL; smoke will use https://www.blah.chat"
              SMOKE_BASE_URL="https://www.blah.chat"
            else
              echo "::error::Missing CI secret SMOKE_BASE_URL"
              exit 1
            fi
          fi
          echo "SMOKE_BASE_URL=$SMOKE_BASE_URL" >> "$GITHUB_ENV"

          if [ -z "$SMOKE_AUTH_STORAGE_STATE_B64" ]; then
            if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
              echo "::warning::Missing CI secret SMOKE_AUTH_STORAGE_STATE_B64; authenticated smoke will be skipped"
              echo "SMOKE_AUTH_STORAGE_STATE_PATH=" >> "$GITHUB_ENV"
              exit 0
            fi
            echo "::error::Missing CI secret SMOKE_AUTH_STORAGE_STATE_B64"
            exit 1
          fi
          printf '%s' "$SMOKE_AUTH_STORAGE_STATE_B64" | base64 -d > .smoke-storage-state.json
          echo "SMOKE_AUTH_STORAGE_STATE_PATH=.smoke-storage-state.json" >> "$GITHUB_ENV"

      - name: Install Playwright browsers (chromium only)
        working-directory: apps/web
        run: bunx playwright install --with-deps chromium

      - name: Run smoke spec
        working-directory: apps/web
        run: bunx playwright test --config=playwright.smoke.config.ts
