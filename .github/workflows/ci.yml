name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  lint-and-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify publishable packages have docs + publish config
        run: bun run package-docs:check

      - name: Run Biome check (lint + format)
        run: bun run lint

      - name: Verify API client OpenAPI types are in sync
        run: |
          bun run api-client:generate
          if ! git diff --exit-code packages/api-client/src/generated/openapi.ts; then
            echo "::error::API client OpenAPI types are out of sync! Run 'bun run api-client:generate'."
            exit 1
          fi

      - name: Enforce API client version bump for contract/runtime changes
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch origin "$BASE_REF" --depth=1
          bun run api-client:version-check --base "origin/$BASE_REF"

      - name: Enforce desktop version sync
        run: bun run desktop:version-check

      - name: Verify Drizzle migrations are up-to-date with schema
        run: |
          bun run db:generate
          if ! git diff --exit-code packages/persistence-postgres/drizzle/; then
            echo "::error::Drizzle migrations are out of sync with schema! Run 'bun run db:generate' and commit the result."
            exit 1
          fi

  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    environment: staging

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        run: bun run test:run

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, test]
    environment: staging

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build Next.js app
        run: bun run build
        env:
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
