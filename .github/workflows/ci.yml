name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
  push:
    branches: [main]

# Workflow-level env so every job inherits cache + filter wiring.
# - TURBO_TOKEN/TURBO_TEAM enable Turborepo Remote Cache (Vercel) when secrets exist.
# - TURBO_FILTER scopes runs to packages affected since the PR base. On push to main
#   and workflow_dispatch it's empty, so the full graph runs (relying on cache to skip
#   unchanged work).
env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}
  TURBO_FILTER: ${{ github.event_name == 'pull_request' && format('--filter=...[origin/{0}]', github.base_ref) || '' }}

jobs:
  lint-and-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Fetch base ref for turbo affected filter
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: git fetch origin "$BASE_REF" --depth=1

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5

      - name: Cache Bun install dir
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Cache Turbo local artifacts
        uses: actions/cache@v4
        with:
          path: node_modules/.cache/turbo
          key: ${{ runner.os }}-turbo-lint-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-lint-
            ${{ runner.os }}-turbo-

      - name: Verify publishable packages have docs + publish config
        run: bun run package-docs:check

      - name: Run Biome check (lint + format)
        run: bun run lint -- $TURBO_FILTER

      - name: Verify API client OpenAPI types are in sync
        run: |
          bun run api-client:generate
          if ! git diff --exit-code packages/api-client/src/generated/openapi.ts; then
            echo "::error::API client OpenAPI types are out of sync! Run 'bun run api-client:generate'."
            exit 1
          fi

      - name: Enforce API client version bump for contract/runtime changes
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: bun run api-client:version-check --base "origin/$BASE_REF"

      - name: Enforce desktop version sync
        run: bun run desktop:version-check

      - name: Verify Drizzle migrations are up-to-date with schema
        run: |
          bun run db:generate
          if [ -n "$(git status --porcelain packages/persistence-postgres/drizzle/)" ]; then
            echo "::error::Drizzle migrations are out of sync with schema! Run 'bun run db:generate' and commit the result."
            git status packages/persistence-postgres/drizzle/
            exit 1
          fi

  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    environment: staging

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Fetch base ref for turbo affected filter
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: git fetch origin "$BASE_REF" --depth=1

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5

      - name: Cache Bun install dir
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Cache Turbo local artifacts
        uses: actions/cache@v4
        with:
          path: node_modules/.cache/turbo
          key: ${{ runner.os }}-turbo-test-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-test-
            ${{ runner.os }}-turbo-

      - name: Run tests
        run: bun run test:run -- $TURBO_FILTER

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, test]
    environment: staging

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Fetch base ref for turbo affected filter
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: git fetch origin "$BASE_REF" --depth=1

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5

      - name: Cache Bun install dir
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Cache Turbo local artifacts
        uses: actions/cache@v4
        with:
          path: node_modules/.cache/turbo
          key: ${{ runner.os }}-turbo-build-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-build-
            ${{ runner.os }}-turbo-

      - name: Build
        run: bun run build -- $TURBO_FILTER
        env:
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
