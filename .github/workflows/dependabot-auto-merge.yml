name: Dependabot Auto-Merge

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    name: Auto-merge Dependabot PRs
    runs-on: ubuntu-latest
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      (github.event.workflow_run.event == 'pull_request' ||
      github.event.workflow_run.event == 'workflow_dispatch')

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Get PR number
        id: pr
        run: |
          PR_NUMBER=$(jq -r '.workflow_run.pull_requests[0].number // ""' "$GITHUB_EVENT_PATH")

          if [ -z "$PR_NUMBER" ] && [ -n "$HEAD_BRANCH" ]; then
            PR_NUMBER=$(gh pr list --repo "$REPO" --head "$HEAD_BRANCH" --json number --jq '.[0].number // ""')
          fi

          if [ -z "$PR_NUMBER" ] && [ -n "$HEAD_SHA" ]; then
            PR_NUMBER=$(gh api "repos/$REPO/commits/$HEAD_SHA/pulls" --jq 'map(select(.state == "open")) | .[0].number // ""')
          fi

          echo "number=$PR_NUMBER" >> $GITHUB_OUTPUT

          if [ -z "$PR_NUMBER" ]; then
            echo "author=" >> $GITHUB_OUTPUT
            exit 0
          fi

          PR_AUTHOR=$(gh pr view "$PR_NUMBER" --repo "$REPO" --json author --jq '.author.login')
          echo "author=$PR_AUTHOR" >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ secrets.MERGE_BOT_TOKEN || secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}

      - name: Check if dependabot PR
        id: check
        if: steps.pr.outputs.number != '' && steps.pr.outputs.author == 'dependabot[bot]'
        run: echo "is_dependabot=true" >> $GITHUB_OUTPUT

      - name: Dependabot metadata
        if: steps.check.outputs.is_dependabot == 'true'
        id: metadata
        uses: dependabot/fetch-metadata@v2
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      - name: Approve Dependabot PR
        if: steps.check.outputs.is_dependabot == 'true'
        run: |
          if gh pr review --approve "$PR_NUMBER" --repo "$REPO"; then
            echo "::notice::Approved PR #$PR_NUMBER"
            exit 0
          fi
          echo "::notice::Approval skipped/failed (token lacks permission or branch rules block approvals). Leaving PR open."
          exit 0
        env:
          GH_TOKEN: ${{ secrets.MERGE_BOT_TOKEN || secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}

      - name: Merge Dependabot PR
        if: steps.check.outputs.is_dependabot == 'true'
        run: |
          if gh pr merge --rebase "$PR_NUMBER" --repo "$REPO"; then
            exit 0
          fi
          echo "::notice::Merge skipped/failed (likely requires approval). Leaving PR open."
          exit 0
        env:
          GH_TOKEN: ${{ secrets.MERGE_BOT_TOKEN || secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
