name: Dependabot Lockfile Fix

on:
  pull_request:
    branches: [main]

permissions:
  actions: write
  contents: write
  pull-requests: write

jobs:
  update-lockfile:
    name: Update Lockfile
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Git for push
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: git checkout "$HEAD_REF"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5

      - name: Update lockfile
        run: bun install --no-frozen-lockfile

      - name: Commit and push if changed
        id: commit
        env:
          LEFTHOOK: "0"
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet bun.lock; then
            echo "No lockfile changes"
            echo "lockfile_changed=false" >> "$GITHUB_OUTPUT"
          else
            git add bun.lock
            git commit -m "chore: update bun.lock"
            git push
            echo "lockfile_changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger CI on updated branch
        if: steps.commit.outputs.lockfile_changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          HEAD_REF: ${{ github.head_ref }}
        run: gh workflow run ci.yml --repo "$REPO" --ref "$HEAD_REF"

      - name: Trigger deploy dry-run on updated branch
        if: steps.commit.outputs.lockfile_changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          HEAD_REF: ${{ github.head_ref }}
        run: gh workflow run deploy.yml --repo "$REPO" --ref "$HEAD_REF"
