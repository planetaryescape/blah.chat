name: Deploy Trigger.dev

on:
  pull_request:
    branches: [main]
    paths:
      - "packages/jobs/**"
      - "packages/ai/**"
      - "packages/persistence-postgres/**"
      - "packages/shared/**"
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  dry-run:
    name: Trigger.dev Dry Run
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build workspace dependencies
        run: bunx turbo run build --filter=@blah-chat/ai --filter=@blah-chat/persistence-postgres --filter=@blah-chat/shared

      - name: Trigger.dev dry run
        run: bunx trigger.dev@4.4.3 deploy --dry-run
        working-directory: packages/jobs
        env:
          TRIGGER_ACCESS_TOKEN: ${{ secrets.TRIGGER_ACCESS_TOKEN }}

  deploy:
    name: Deploy to Trigger.dev
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build workspace dependencies
        run: bunx turbo run build --filter=@blah-chat/ai --filter=@blah-chat/persistence-postgres --filter=@blah-chat/shared

      - name: Deploy Trigger.dev tasks
        run: bunx trigger.dev@4.4.3 deploy
        working-directory: packages/jobs
        env:
          TRIGGER_ACCESS_TOKEN: ${{ secrets.TRIGGER_ACCESS_TOKEN }}
