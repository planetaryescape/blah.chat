name: Release CLI

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g., 0.1.0)"
        required: true
        type: string

jobs:
  build-cli:
    name: Build CLI (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: darwin-arm64
            os: macos-14
            archive: blah-cli-darwin-arm64.tar.gz
          # darwin-x64 disabled - requires paid macos-15-large runner
          # Re-enable when billing configured or cross-compilation added
          - platform: linux-x64
            os: ubuntu-latest
            archive: blah-cli-linux-x64.tar.gz
          - platform: linux-arm64
            os: ubuntu-24.04-arm
            archive: blah-cli-linux-arm64.tar.gz
          - platform: windows-x64
            os: windows-latest
            archive: blah-cli-windows-x64.zip

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build CLI binary
        run: bun run apps/cli/scripts/compile.ts --single

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: apps/cli/dist/release/${{ matrix.archive }}
          retention-days: 1

  create-release:
    name: Create Release
    needs: build-cli
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -la artifacts/

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          REPO: ${{ github.repository }}
        run: |
          gh release create "cli-v$VERSION" \
            --repo "$REPO" \
            --draft \
            --title "blah CLI v$VERSION" \
            --notes "## blah CLI v$VERSION

          ### Installation

          **Homebrew (macOS/Linux)**
          \`\`\`bash
          brew install planetaryescape/tap/blah
          \`\`\`

          **Direct Download**
          Download the appropriate binary for your platform from the assets below."

      - name: Upload assets to draft
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          REPO: ${{ github.repository }}
        run: gh release upload "cli-v$VERSION" artifacts/* --repo "$REPO"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          REPO: ${{ github.repository }}
        run: gh release edit "cli-v$VERSION" --draft=false --repo "$REPO"

  publish-npm:
    name: Publish to npm
    needs: create-release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: bun run apps/cli/scripts/publish.ts --version "$VERSION"
