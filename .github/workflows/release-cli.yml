name: Release CLI

on:
  release:
    types: [published]

jobs:
  build-cli:
    name: Build CLI (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: darwin-arm64
            os: macos-14
            archive: blah-cli-darwin-arm64.tar.gz
          - platform: darwin-x64
            os: macos-15-large
            archive: blah-cli-darwin-x64.tar.gz
          - platform: linux-x64
            os: ubuntu-latest
            archive: blah-cli-linux-x64.tar.gz
          - platform: linux-arm64
            os: ubuntu-24.04-arm
            archive: blah-cli-linux-arm64.tar.gz
          - platform: windows-x64
            os: windows-latest
            archive: blah-cli-windows-x64.zip

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build CLI binary
        run: bun run apps/cli/scripts/compile.ts --single

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: apps/cli/dist/release/${{ matrix.archive }}
          retention-days: 1

  upload-release:
    name: Upload Release Assets
    needs: build-cli
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          REPO: ${{ github.repository }}
        run: gh release upload "$RELEASE_TAG" artifacts/* --clobber --repo "$REPO"
