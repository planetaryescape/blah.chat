name: Release CLI

on:
  release:
    types: [published]

jobs:
  build-cli:
    name: Build CLI Binaries
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build CLI binaries
        run: bun run apps/cli/scripts/compile.ts

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" apps/cli/dist/release/*.tar.gz apps/cli/dist/release/*.zip --clobber
