name: Finalize Desktop Notarization

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Desktop release tag (desktop-vX.Y.Z)"
        required: true
        type: string

jobs:
  finalize:
    name: Staple + publish desktop release
    runs-on: macos-14
    environment: production
    permissions:
      contents: write

    steps:
      - name: Validate release is draft
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          if ! gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            echo "::error::Release $TAG not found."
            exit 1
          fi

          IS_DRAFT="$(gh release view "$TAG" --repo "$REPO" --json isDraft --jq '.isDraft')"
          if [ "${IS_DRAFT:-false}" != "true" ]; then
            echo "::error::Release $TAG is already published (immutable)."
            exit 1
          fi

      - name: Resolve notarization submission id
        id: submission
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          BODY="$(gh release view "$TAG" --repo "$REPO" --json body --jq '.body // ""')"
          SUBMISSION_ID="$(
            printf '%s' "$BODY" \
              | grep -Eo 'Notarization submission id:[[:space:]]*[0-9a-fA-F-]{36}' \
              | head -n 1 \
              | sed -E 's/.*id:[[:space:]]*//'
          )"

          if [ -z "${SUBMISSION_ID:-}" ]; then
            echo "::error::No notarization submission id found in release notes."
            exit 1
          fi

          echo "id=$SUBMISSION_ID" >> "$GITHUB_OUTPUT"
          echo "::notice::Using notarization submission id: $SUBMISSION_ID"

      - name: Download DMG from draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/desktop-release
          gh release download "$TAG" --repo "$REPO" --pattern "*.dmg" --dir /tmp/desktop-release

          DMG="$(ls -1 /tmp/desktop-release/*.dmg | head -n1 || true)"
          if [ -z "${DMG:-}" ]; then
            echo "::error::No DMG found in draft release assets."
            exit 1
          fi

          echo "DMG=$DMG" >> "$GITHUB_ENV"

      - name: Check notarization status (no wait)
        id: status
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          SUBMISSION_ID: ${{ steps.submission.outputs.id }}
        run: |
          set -euo pipefail

          INFO_JSON="$(xcrun notarytool info "$SUBMISSION_ID" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --no-progress \
            -f json)"

          STATUS="$(
            printf '%s' "$INFO_JSON" \
              | jq -r '.. | objects | .status? | select(type=="string")' \
              | head -n 1
          )"

          if [ -z "${STATUS:-}" ]; then
            echo "::error::Failed to parse notarization status."
            echo "$INFO_JSON"
            exit 1
          fi

          echo "value=$STATUS" >> "$GITHUB_OUTPUT"
          echo "::notice::Notarization status: $STATUS"

      - name: Stop if still in progress
        if: steps.status.outputs.value == 'In Progress'
        run: |
          echo "::notice::Notarization still in progress. Re-run this workflow later."

      - name: Fetch notarization log (on failure)
        if: steps.status.outputs.value != 'Accepted' && steps.status.outputs.value != 'In Progress'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          SUBMISSION_ID: ${{ steps.submission.outputs.id }}
        run: |
          set -euo pipefail
          xcrun notarytool log "$SUBMISSION_ID" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            /tmp/notary-log.json || true
          echo "::error::Notarization not accepted (status=${{ steps.status.outputs.value }}). See log above."
          exit 1

      - name: Staple DMG + verify
        if: steps.status.outputs.value == 'Accepted'
        run: |
          set -euo pipefail
          xcrun stapler staple -v "$DMG"
          xcrun stapler validate "$DMG"
          spctl -a -vv -t open --context context:primary-signature "$DMG"

      - name: Re-upload stapled DMG + publish release
        if: steps.status.outputs.value == 'Accepted'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release upload "$TAG" "$DMG" --repo "$REPO" --clobber
          gh release edit "$TAG" --repo "$REPO" --draft=false
