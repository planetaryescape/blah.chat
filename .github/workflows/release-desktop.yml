name: Release Desktop

on:
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      tag:
        description: "Desktop release tag (desktop-vX.Y.Z)"
        required: true
        type: string

jobs:
  prepare:
    name: Prepare desktop release metadata
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.parse.outputs.should_release }}
      tag: ${{ steps.parse.outputs.tag }}
      version: ${{ steps.parse.outputs.version }}
    steps:
      - name: Parse release tag
        id: parse
        shell: bash
        run: |
          TAG="${{ github.event.release.tag_name }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          fi

          if [[ "$TAG" =~ ^desktop-v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
            echo "version=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
            echo "::notice::Building desktop release for $TAG"
          else
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping non-desktop tag: $TAG"
          fi

  release:
    name: Build + publish desktop artifacts
    needs: prepare
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: macos-14
    environment: production
    permissions:
      contents: write
    concurrency:
      group: desktop-release-${{ needs.prepare.outputs.tag }}
      cancel-in-progress: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate desktop release secrets
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          DESKTOP_UPDATER_CONFIG_JSON: ${{ secrets.DESKTOP_UPDATER_CONFIG_JSON }}
        run: |
          REQUIRED=(
            APPLE_CERTIFICATE
            APPLE_CERTIFICATE_PASSWORD
            APPLE_SIGNING_IDENTITY
            APPLE_ID
            APPLE_PASSWORD
            APPLE_TEAM_ID
            TAURI_SIGNING_PRIVATE_KEY
            TAURI_SIGNING_PRIVATE_KEY_PASSWORD
          )

          MISSING=()
          for KEY in "${REQUIRED[@]}"; do
            if [ -z "${!KEY}" ]; then
              MISSING+=("$KEY")
            fi
          done

          if [ ${#MISSING[@]} -gt 0 ]; then
            echo "::error::Missing required secrets: ${MISSING[*]}"
            exit 1
          fi

          if ! printf '%s' "$APPLE_SIGNING_IDENTITY" | grep -Eq '^Developer ID Application:'; then
            echo "::error::APPLE_SIGNING_IDENTITY must be a Developer ID Application identity (not Apple Development)."
            exit 1
          fi

          if [ -n "${DESKTOP_UPDATER_CONFIG_JSON:-}" ]; then
            echo "$DESKTOP_UPDATER_CONFIG_JSON" | jq -e '
              type == "object" and
              (.active | type == "boolean") and
              (.pubkey | type == "string") and
              (.endpoints | type == "array")
            ' >/dev/null
          fi

      - name: Validate Apple notarization credentials
        run: |
          echo "::notice::Skipping preflight notarization auth check; notarization is submitted async later and finalized in a separate workflow."

      - name: Sync desktop versions + updater config from release metadata
        shell: bash
        env:
          DESKTOP_UPDATER_CONFIG_JSON: ${{ secrets.DESKTOP_UPDATER_CONFIG_JSON }}
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"

          jq ".version = \"$VERSION\"" apps/desktop/package.json > /tmp/desktop.package.json
          mv /tmp/desktop.package.json apps/desktop/package.json

          if [ -n "${DESKTOP_UPDATER_CONFIG_JSON:-}" ]; then
            jq \
              --arg version "$VERSION" \
              --argjson updater "$DESKTOP_UPDATER_CONFIG_JSON" \
              '.version = $version | .plugins.updater = $updater' \
              apps/desktop/src-tauri/tauri.conf.json > /tmp/desktop.tauri.conf.json
            echo "::notice::Updater config injected from DESKTOP_UPDATER_CONFIG_JSON"
          else
            jq ".version = \"$VERSION\"" apps/desktop/src-tauri/tauri.conf.json > /tmp/desktop.tauri.conf.json
            echo "::notice::Updater config unchanged (default from repo)"
          fi

          mv /tmp/desktop.tauri.conf.json apps/desktop/src-tauri/tauri.conf.json

          perl -0pi -e "s/^version = \"[^\"]+\"/version = \"$VERSION\"/m" apps/desktop/src-tauri/Cargo.toml

      - name: Build signed desktop artifacts
        working-directory: apps/desktop
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: bun run build:bundle -- --skip-stapling

      - name: Ensure GitHub release exists
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            IS_DRAFT="$(gh release view "$TAG" --repo "$REPO" --json isDraft --jq '.isDraft')"
            if [ "${IS_DRAFT:-false}" != "true" ]; then
              echo "::error::Release $TAG is already published (immutable). Can't upload assets. Cut a new desktop version tag."
              exit 1
            fi
          else
            gh release create "$TAG" \
              --repo "$REPO" \
              --title "Desktop $TAG" \
              --notes "blah.chat desktop release ($TAG)" \
              --draft
          fi

          echo "skip_upload=false" >> "$GITHUB_OUTPUT"

      - name: Upload desktop release assets
        if: steps.release.outputs.skip_upload != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          ASSET_ROOT="apps/desktop/src-tauri/target/release/bundle"
          ASSETS=()
          while IFS= read -r -d '' f; do
            ASSETS+=("$f")
          done < <(find "$ASSET_ROOT" -type f \( \
            -name "*.dmg" -o \
            -name "*.app.tar.gz" -o \
            -name "*.app.tar.gz.sig" -o \
            -name "latest*.json" \
          \) -print0)

          if [ ${#ASSETS[@]} -eq 0 ]; then
            echo "::error::No desktop release assets found under $ASSET_ROOT"
            exit 1
          fi

          gh release upload "$TAG" "${ASSETS[@]}" --repo "$REPO" --clobber

      - name: Notarize desktop dmg (notarytool)
        if: steps.release.outputs.skip_upload != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
          REPO: ${{ github.repository }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail

          DMG="$(find apps/desktop/src-tauri/target/release/bundle -type f -name '*.dmg' | head -n 1 || true)"
          if [ -z "${DMG:-}" ]; then
            echo "::error::No .dmg found after upload."
            exit 1
          fi

          # Async submit only (no --wait). Avoid burning macOS runner minutes polling.
          SUBMISSION_JSON="$(xcrun notarytool submit "$DMG" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --no-wait \
            --no-progress \
            -f json)"

          SUBMISSION_ID="$(
            printf '%s' "$SUBMISSION_JSON" \
              | jq -r '.. | objects | .id? // .uuid? // .submissionId? // .submission_id? | select(type=="string")' \
              | head -n 1
          )"

          if [ -z "${SUBMISSION_ID:-}" ]; then
            SUBMISSION_ID="$(printf '%s' "$SUBMISSION_JSON" | grep -Eo '[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}' | head -n1 || true)"
          fi

          if [ -z "${SUBMISSION_ID:-}" ]; then
            echo "::error::Failed to parse notarization submission ID."
            echo "$SUBMISSION_JSON"
            exit 1
          fi

          BODY_FILE="$(mktemp)"
          gh release view "$TAG" --repo "$REPO" --json body --jq '.body // ""' > "$BODY_FILE" || true

          if ! grep -Fq "$SUBMISSION_ID" "$BODY_FILE"; then
            printf '\nNotarization submission id: %s\n' "$SUBMISSION_ID" >> "$BODY_FILE"
            gh release edit "$TAG" --repo "$REPO" --notes-file "$BODY_FILE"
          fi

          echo "::notice::Notarization submitted async. Release remains draft until finalize workflow runs."
