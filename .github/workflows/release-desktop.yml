name: Release Desktop

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Desktop release tag (desktop-vX.Y.Z)"
        required: true
        type: string

jobs:
  prepare:
    name: Prepare desktop release metadata
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.parse.outputs.should_release }}
      tag: ${{ steps.parse.outputs.tag }}
      version: ${{ steps.parse.outputs.version }}
    steps:
      - name: Parse release tag
        id: parse
        shell: bash
        run: |
          TAG="${{ github.event.release.tag_name }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          fi

          if [[ "$TAG" =~ ^desktop-v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
            echo "version=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
            echo "::notice::Building desktop release for $TAG"
          else
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping non-desktop tag: $TAG"
          fi

  release:
    name: Build + publish desktop artifacts
    needs: prepare
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: macos-14
    environment: production
    permissions:
      contents: write
    concurrency:
      group: desktop-release-${{ needs.prepare.outputs.tag }}
      cancel-in-progress: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate desktop release secrets
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          DESKTOP_UPDATER_CONFIG_JSON: ${{ secrets.DESKTOP_UPDATER_CONFIG_JSON }}
        run: |
          REQUIRED=(
            APPLE_CERTIFICATE
            APPLE_CERTIFICATE_PASSWORD
            APPLE_SIGNING_IDENTITY
            APPLE_ID
            APPLE_PASSWORD
            APPLE_TEAM_ID
            TAURI_SIGNING_PRIVATE_KEY
            TAURI_SIGNING_PRIVATE_KEY_PASSWORD
          )

          MISSING=()
          for KEY in "${REQUIRED[@]}"; do
            if [ -z "${!KEY}" ]; then
              MISSING+=("$KEY")
            fi
          done

          if [ ${#MISSING[@]} -gt 0 ]; then
            echo "::error::Missing required secrets: ${MISSING[*]}"
            exit 1
          fi

          if ! printf '%s' "$APPLE_SIGNING_IDENTITY" | grep -Eq '^Developer ID Application:'; then
            echo "::error::APPLE_SIGNING_IDENTITY must be a Developer ID Application identity (not Apple Development)."
            exit 1
          fi

          if [ -n "${DESKTOP_UPDATER_CONFIG_JSON:-}" ]; then
            echo "$DESKTOP_UPDATER_CONFIG_JSON" | jq -e '
              type == "object" and
              (.active | type == "boolean") and
              (.pubkey | type == "string") and
              (.endpoints | type == "array")
            ' >/dev/null
          fi

      - name: Validate Apple notarization credentials
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if ! xcrun notarytool history \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" >/dev/null; then
            echo "::error::Apple notarization auth failed. Verify APPLE_ID, APPLE_PASSWORD (app-specific password), and APPLE_TEAM_ID."
            exit 1
          fi

      - name: Sync desktop versions + updater config from release metadata
        shell: bash
        env:
          DESKTOP_UPDATER_CONFIG_JSON: ${{ secrets.DESKTOP_UPDATER_CONFIG_JSON }}
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"

          jq ".version = \"$VERSION\"" apps/desktop/package.json > /tmp/desktop.package.json
          mv /tmp/desktop.package.json apps/desktop/package.json

          if [ -n "${DESKTOP_UPDATER_CONFIG_JSON:-}" ]; then
            jq \
              --arg version "$VERSION" \
              --argjson updater "$DESKTOP_UPDATER_CONFIG_JSON" \
              '.version = $version | .plugins.updater = $updater' \
              apps/desktop/src-tauri/tauri.conf.json > /tmp/desktop.tauri.conf.json
            echo "::notice::Updater config injected from DESKTOP_UPDATER_CONFIG_JSON"
          else
            jq ".version = \"$VERSION\"" apps/desktop/src-tauri/tauri.conf.json > /tmp/desktop.tauri.conf.json
            echo "::notice::Updater config unchanged (default from repo)"
          fi

          mv /tmp/desktop.tauri.conf.json apps/desktop/src-tauri/tauri.conf.json

          perl -0pi -e "s/^version = \"[^\"]+\"/version = \"$VERSION\"/m" apps/desktop/src-tauri/Cargo.toml

      - name: Build signed desktop artifacts
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          cd apps/desktop

          for i in 1 2 3 4 5; do
            if curl -sSIL --connect-timeout 10 --max-time 30 https://appstoreconnect.apple.com/ >/dev/null; then
              break
            fi
            if [ "$i" -eq 5 ]; then
              echo "::error::No network route to Apple (appstoreconnect.apple.com); notarization cannot proceed."
              exit 1
            fi
            sleep 10
          done

          max_attempts=3
          for attempt in $(seq 1 "$max_attempts"); do
            echo "::notice::Attempt $attempt/$max_attempts: bun run build:bundle (timeout 45m)"
            if python3 - <<'PY'
          import os
          import subprocess
          import sys

          timeout_seconds = 45 * 60
          p = subprocess.Popen(["bun", "run", "build:bundle"], env=os.environ)
          try:
            sys.exit(p.wait(timeout=timeout_seconds))
          except subprocess.TimeoutExpired:
            p.kill()
            try:
              p.wait(timeout=30)
            except Exception:
              pass
            print("::error::Timed out after 45m during build. Likely hang; retrying.")
            sys.exit(124)
          PY
            then
              exit 0
            fi

            if [ "$attempt" -ne "$max_attempts" ]; then
              sleep 120
            fi
          done

          echo "::error::Desktop bundle failed after $max_attempts attempts."
          exit 1

      - name: Notarize desktop dmg (notarytool)
        shell: bash
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail

          DMG="$(find apps/desktop/src-tauri/target/release/bundle -type f -name '*.dmg' | head -n 1 || true)"
          if [ -z "${DMG:-}" ]; then
            echo "::error::No .dmg found after build."
            exit 1
          fi

          max_attempts=3
          for attempt in $(seq 1 "$max_attempts"); do
            echo "::notice::Attempt $attempt/$max_attempts: notarytool submit (timeout 45m)"
            if xcrun notarytool submit "$DMG" \
              --apple-id "$APPLE_ID" \
              --password "$APPLE_PASSWORD" \
              --team-id "$APPLE_TEAM_ID" \
              --wait \
              --timeout 45m; then
              xcrun stapler staple -v "$DMG"
              exit 0
            fi

            if [ "$attempt" -ne "$max_attempts" ]; then
              sleep 120
            fi
          done

          echo "::error::Notarization failed after $max_attempts attempts."
          exit 1

      - name: Ensure GitHub release exists
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          if ! gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --repo "$REPO" \
              --title "Desktop $TAG" \
              --notes "blah.chat desktop release ($TAG)"
          fi

      - name: Upload desktop release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          ASSET_ROOT="apps/desktop/src-tauri/target/release/bundle"
          mapfile -t ASSETS < <(find "$ASSET_ROOT" -type f \( \
            -name "*.dmg" -o \
            -name "*.app.tar.gz" -o \
            -name "*.app.tar.gz.sig" -o \
            -name "latest*.json" \
          \))

          if [ ${#ASSETS[@]} -eq 0 ]; then
            echo "::error::No desktop release assets found under $ASSET_ROOT"
            exit 1
          fi

          gh release upload "$TAG" "${ASSETS[@]}" --repo "$REPO" --clobber
