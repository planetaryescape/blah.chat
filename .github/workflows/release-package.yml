name: Release Package

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Package release tag (<component>-vX.Y.Z)"
        required: true
        type: string

jobs:
  prepare:
    name: Prepare package release metadata
    runs-on: ubuntu-latest
    outputs:
      should_publish: ${{ steps.parse.outputs.should_publish }}
      tag: ${{ steps.parse.outputs.tag }}
      component: ${{ steps.parse.outputs.component }}
      version: ${{ steps.parse.outputs.version }}
    steps:
      - name: Parse release tag
        id: parse
        shell: bash
        run: |
          TAG="${{ github.event.release.tag_name }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          fi

          if [[ "$TAG" =~ ^([a-z0-9-]+)-v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            COMPONENT="${BASH_REMATCH[1]}"
            VERSION="${BASH_REMATCH[2]}"

            echo "should_publish=true" >> "$GITHUB_OUTPUT"
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
            echo "component=$COMPONENT" >> "$GITHUB_OUTPUT"
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
            echo "::notice::Publishing packages/$COMPONENT for tag $TAG"
          else
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping non-package tag: $TAG"
          fi

  publish:
    name: Publish npm package
    needs: prepare
    if: needs.prepare.outputs.should_publish == 'true'
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check package exists
        id: pkgcheck
        shell: bash
        run: |
          COMPONENT="${{ needs.prepare.outputs.component }}"
          PKG_DIR="packages/$COMPONENT"

          if [ -f "$PKG_DIR/package.json" ]; then
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Found $PKG_DIR/package.json"
          else
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping (no $PKG_DIR/package.json)"
          fi

      - name: Validate package metadata + docs
        if: steps.pkgcheck.outputs.should_publish == 'true'
        shell: bash
        run: |
          COMPONENT="${{ needs.prepare.outputs.component }}"
          VERSION="${{ needs.prepare.outputs.version }}"
          PKG_DIR="packages/$COMPONENT"

          if [ ! -f "$PKG_DIR/README.md" ]; then
            echo "::error::$PKG_DIR/README.md missing"
            exit 1
          fi

          PKG_NAME=$(jq -r '.name' "$PKG_DIR/package.json")
          PKG_VERSION=$(jq -r '.version' "$PKG_DIR/package.json")

          if [ "$PKG_NAME" != "@blah-chat/$COMPONENT" ]; then
            echo "::error::$PKG_DIR/package.json name ($PKG_NAME) must be @blah-chat/$COMPONENT"
            exit 1
          fi
          if [ "$PKG_VERSION" != "$VERSION" ]; then
            echo "::error::$PKG_DIR/package.json version ($PKG_VERSION) does not match tag ($VERSION)"
            exit 1
          fi

      - name: Validate API client (extra checks)
        if: steps.pkgcheck.outputs.should_publish == 'true' && needs.prepare.outputs.component == 'api-client'
        run: bun run api-client:check

      - name: Build package (if supported)
        if: steps.pkgcheck.outputs.should_publish == 'true'
        shell: bash
        run: |
          COMPONENT="${{ needs.prepare.outputs.component }}"
          PKG_NAME="@blah-chat/$COMPONENT"

          if bun --filter="$PKG_NAME" run typecheck >/dev/null 2>&1; then
            bun --filter="$PKG_NAME" run typecheck
          else
            echo "::notice::No typecheck script for $PKG_NAME"
          fi

          if bun --filter="$PKG_NAME" run build >/dev/null 2>&1; then
            bun --filter="$PKG_NAME" run build
          else
            echo "::notice::No build script for $PKG_NAME"
          fi

      - name: Prepare package.json for npm (rewrite workspace deps)
        if: steps.pkgcheck.outputs.should_publish == 'true'
        shell: bash
        run: |
          COMPONENT="${{ needs.prepare.outputs.component }}"
          bun run scripts/prepare-npm-publish.ts --package "packages/$COMPONENT"

      - name: Check publish requirement
        if: steps.pkgcheck.outputs.should_publish == 'true'
        id: check
        shell: bash
        run: |
          COMPONENT="${{ needs.prepare.outputs.component }}"
          VERSION="${{ needs.prepare.outputs.version }}"
          if npm view "@blah-chat/$COMPONENT@$VERSION" version >/dev/null 2>&1; then
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
            echo "::notice::@blah-chat/$COMPONENT@$VERSION already published"
          else
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Publishing @blah-chat/$COMPONENT@$VERSION"
          fi

      - name: Publish
        if: steps.pkgcheck.outputs.should_publish == 'true' && steps.check.outputs.should_publish == 'true'
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          COMPONENT="${{ needs.prepare.outputs.component }}"
          cd "packages/$COMPONENT"
          bun publish --access public --yes
