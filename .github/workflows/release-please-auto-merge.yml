name: Release Please Auto-Merge

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    name: Auto-merge release-please PRs
    runs-on: ubuntu-latest
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request'

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Resolve PR metadata
        id: pr
        env:
          GH_TOKEN: ${{ secrets.MERGE_BOT_TOKEN || secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          PR_NUMBER=$(gh pr list --repo "$REPO" --head "$HEAD_BRANCH" --state open --json number --jq '.[0].number')
          if [ -z "$PR_NUMBER" ] || [ "$PR_NUMBER" = "null" ]; then
            echo "should_merge=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No open PR for branch $HEAD_BRANCH"
            exit 0
          fi

          IS_RELEASE_PLEASE_BRANCH="false"
          if printf '%s' "$HEAD_BRANCH" | grep -Eq '^release-please--'; then
            IS_RELEASE_PLEASE_BRANCH="true"
          fi

          HAS_PENDING_LABEL=$(gh pr view "$PR_NUMBER" --repo "$REPO" --json labels --jq '[.labels[].name] | index("autorelease: pending") != null')

          echo "number=$PR_NUMBER" >> "$GITHUB_OUTPUT"

          if [ "$IS_RELEASE_PLEASE_BRANCH" = "true" ] && [ "$HAS_PENDING_LABEL" = "true" ]; then
            echo "should_merge=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Auto-merging release-please PR #$PR_NUMBER"
          else
            echo "should_merge=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping PR #$PR_NUMBER (releaseBranch=$IS_RELEASE_PLEASE_BRANCH label=$HAS_PENDING_LABEL)"
          fi

      - name: Approve release PR
        if: steps.pr.outputs.should_merge == 'true'
        env:
          GH_TOKEN: ${{ secrets.MERGE_BOT_TOKEN || secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          if gh pr review --approve "$PR_NUMBER" --repo "$REPO"; then
            echo "::notice::Approved PR #$PR_NUMBER"
            exit 0
          fi
          echo "::notice::Approval skipped/failed (token lacks permission or branch rules block approvals). Leaving PR open."
          exit 0

      - name: Merge release PR
        id: merge
        if: steps.pr.outputs.should_merge == 'true'
        env:
          GH_TOKEN: ${{ secrets.MERGE_BOT_TOKEN || secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          if gh pr merge --squash --delete-branch "$PR_NUMBER" --repo "$REPO"; then
            echo "merged=true" >> "$GITHUB_OUTPUT"
          else
            echo "merged=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Merge skipped/failed (likely requires approval). Leaving PR open."
            exit 0
          fi

      - name: Remove pending label
        if: steps.pr.outputs.should_merge == 'true' && steps.merge.outputs.merged == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: 'gh pr edit "$PR_NUMBER" --repo "$REPO" --remove-label "autorelease: pending" || true'
