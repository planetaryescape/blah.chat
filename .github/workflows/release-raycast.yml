name: Release Raycast

on:
  push:
    branches: [main]
    paths:
      - "apps/raycast/**"
      - "packages/sdk/**"
      - ".github/workflows/release-raycast.yml"
  workflow_dispatch:

jobs:
  build:
    name: Build Raycast Extension
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint Raycast extension
        run: bun --filter=@blah-chat/raycast run lint

      - name: Build Raycast extension
        run: bun --filter=@blah-chat/raycast run build

  publish:
    name: Publish to Raycast Store
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate Raycast publish secrets
        env:
          RAY_TOKEN: ${{ secrets.RAY_TOKEN }}
          RAYCAST_OWNER: ${{ secrets.RAYCAST_OWNER }}
        run: |
          if [ -z "$RAY_TOKEN" ]; then
            echo "::error::Missing production secret RAY_TOKEN"
            exit 1
          fi

          if [ -z "$RAYCAST_OWNER" ]; then
            echo "::error::Missing production secret RAYCAST_OWNER"
            echo "::error::Non-interactive publish requires owner-mode extension publishing."
            exit 1
          fi

      - name: Prepare owner-mode manifest for CI publish
        env:
          RAYCAST_OWNER: ${{ secrets.RAYCAST_OWNER }}
        run: |
          jq --arg owner "$RAYCAST_OWNER" '.owner = $owner' apps/raycast/package.json > /tmp/raycast.package.json
          mv /tmp/raycast.package.json apps/raycast/package.json

      - name: Publish Raycast extension
        working-directory: apps/raycast
        env:
          RAY_TOKEN: ${{ secrets.RAY_TOKEN }}
        run: bunx @raycast/api@latest publish --non-interactive --exit-on-error
