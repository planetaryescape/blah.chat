name: Release SDK

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "SDK release tag (sdk-vX.Y.Z)"
        required: true
        type: string

jobs:
  prepare:
    name: Prepare SDK release metadata
    runs-on: ubuntu-latest
    outputs:
      should_publish: ${{ steps.parse.outputs.should_publish }}
      tag: ${{ steps.parse.outputs.tag }}
      version: ${{ steps.parse.outputs.version }}
    steps:
      - name: Parse release tag
        id: parse
        shell: bash
        run: |
          TAG="${{ github.event.release.tag_name }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          fi

          if [[ "$TAG" =~ ^sdk-v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
            echo "version=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
            echo "::notice::Publishing SDK for tag $TAG"
          else
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping non-SDK tag: $TAG"
          fi

  publish:
    name: Publish @blah-chat/sdk
    needs: prepare
    if: needs.prepare.outputs.should_publish == 'true'
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate SDK
        run: |
          bun run sdk:check
          bun --filter=@blah-chat/sdk run typecheck
          bun --filter=@blah-chat/sdk run build

      - name: Verify package version matches tag
        shell: bash
        run: |
          PKG_VERSION=$(jq -r '.version' packages/sdk/package.json)
          TAG_VERSION="${{ needs.prepare.outputs.version }}"

          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::packages/sdk/package.json version ($PKG_VERSION) does not match tag ($TAG_VERSION)"
            exit 1
          fi

      - name: Check publish requirement
        id: check
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          if npm view "@blah-chat/sdk@$VERSION" version >/dev/null 2>&1; then
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
            echo "::notice::@blah-chat/sdk@$VERSION already published"
          else
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Publishing @blah-chat/sdk@$VERSION"
          fi

      - name: Publish SDK
        if: steps.check.outputs.should_publish == 'true'
        working-directory: packages/sdk
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: bun publish --access public --yes
