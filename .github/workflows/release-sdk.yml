name: Release SDK

on:
  push:
    branches: [main]
    paths:
      - "packages/sdk/**"
      - ".github/workflows/release-sdk.yml"
  workflow_dispatch:

jobs:
  publish:
    name: Publish @blah-chat/sdk
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate SDK
        run: |
          bun run sdk:check
          bun --filter=@blah-chat/sdk run typecheck
          bun --filter=@blah-chat/sdk run build

      - name: Check publish requirement
        id: check
        run: |
          VERSION=$(jq -r '.version' packages/sdk/package.json)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          if npm view "@blah-chat/sdk@$VERSION" version >/dev/null 2>&1; then
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
            echo "::notice::@blah-chat/sdk@$VERSION already published"
          else
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Publishing @blah-chat/sdk@$VERSION"
          fi

      - name: Publish SDK
        if: steps.check.outputs.should_publish == 'true'
        working-directory: packages/sdk
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: bun publish --access public --yes
