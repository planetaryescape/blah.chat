name: Production Deploy

on:
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy-production:
    name: Deploy Convex and stage Vercel
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-latest
    environment: production
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Audit production dependencies
        run: bun audit --prod --audit-level=high

      - name: Test backend
        run: bun run test:run -- --filter=@blah-chat/backend

      - name: Deploy compatible Convex functions
        working-directory: packages/backend
        run: bun run deploy -- --yes
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}

      - name: Install Vercel CLI
        run: bun add --global vercel@56.4.0

      # Remote builds retain sensitive Vercel values, which env pull redacts.
      - name: Stage production without moving domains
        id: stage
        run: |
          URL=$(vercel deploy --prod --skip-domain --yes)
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Verify Convex readiness
        env:
          DEPLOYMENT_URL: ${{ steps.stage.outputs.url }}
        run: |
          vercel curl /api/v1/health --deployment "$DEPLOYMENT_URL" > health.json
          bun -e 'const h=await Bun.file("health.json").json(); if(h.data?.backend!=="convex" || h.data?.status!=="ok") process.exit(1)'

      - name: Promote the tested production artifact
        env:
          DEPLOYMENT_URL: ${{ steps.stage.outputs.url }}
        run: vercel promote "$DEPLOYMENT_URL" --yes
