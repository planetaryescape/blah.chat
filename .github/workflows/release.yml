name: Production Deploy

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      promote_deployment:
        description: "Exact staged deployment URL verified with sign-in and generation (blank stages a new build only)"
        required: false
        type: string
      acknowledge_user_journeys:
        description: "I verified sign-in, send, refresh and persisted responses on this exact deployment"
        required: true
        type: boolean
        default: false

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read
  checks: read

jobs:
  deploy-production:
    name: Deploy Convex and stage Vercel
    if: (github.event_name == 'workflow_dispatch' && inputs.promote_deployment == '') || (github.event_name == 'release' && startsWith(github.event.release.tag_name, 'v'))
    runs-on: ubuntu-latest
    environment: production
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Audit production dependencies
        run: bun audit --prod --audit-level=high

      - name: Test backend
        run: bun run test:run -- --filter=@blah-chat/backend

      - name: Deploy compatible Convex functions
        working-directory: packages/backend
        run: bun run deploy
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}

      - name: Install Vercel CLI
        run: bun add --global vercel@56.4.0

      # Remote builds retain sensitive Vercel values, which env pull redacts.
      - name: Stage production without moving domains
        id: stage
        run: |
          URL=$(vercel deploy --prod --skip-domain --yes)
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Verify Convex readiness
        env:
          DEPLOYMENT_URL: ${{ steps.stage.outputs.url }}
        run: |
          vercel curl /api/v1/health --deployment "$DEPLOYMENT_URL" > health.json
          bun -e 'const h=await Bun.file("health.json").json(); if(h.data?.backend!=="convex" || h.data?.status!=="ok") process.exit(1)'

      - name: Report staged artifact for manual journey verification
        env:
          DEPLOYMENT_URL: ${{ steps.stage.outputs.url }}
        run: |
          echo "Staged deployment: $DEPLOYMENT_URL" >> "$GITHUB_STEP_SUMMARY"
          echo "Verify sign-in, send, refresh and persisted responses, then dispatch this workflow with that exact URL to promote." >> "$GITHUB_STEP_SUMMARY"

  promote-production:
    name: Manually promote a journey-verified artifact
    if: github.event_name == 'workflow_dispatch' && inputs.promote_deployment != ''
    runs-on: ubuntu-latest
    environment: production
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      DEPLOYMENT_URL: ${{ inputs.promote_deployment }}
      ACKNOWLEDGE_USER_JOURNEYS: ${{ inputs.acknowledge_user_journeys }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Require explicit user-journey verification
        run: test "$ACKNOWLEDGE_USER_JOURNEYS" = "true"
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5
      - name: Install Vercel CLI
        run: bun add --global vercel@56.4.0
      - name: Promote the explicitly verified artifact without rebuilding
        run: bun apps/desktop/scripts/promote.ts
