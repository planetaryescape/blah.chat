name: Rollback

on:
  workflow_dispatch:
    inputs:
      deployment:
        description: "Previously verified Vercel production deployment URL or ID"
        required: true
        type: string
      acknowledge_database:
        description: "Database changes are not reversed; verify backend compatibility first"
        required: true
        type: boolean
        default: false

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  rollback-vercel:
    runs-on: ubuntu-latest
    environment: production
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      DEPLOYMENT: ${{ inputs.deployment }}
      ACKNOWLEDGE_DATABASE: ${{ inputs.acknowledge_database }}
    steps:
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5
      - name: Require backend compatibility acknowledgement
        run: test "$ACKNOWLEDGE_DATABASE" = "true"
      - name: Install Vercel CLI
        run: bun add --global vercel@56.4.0
      - name: Restore the existing artifact without rebuilding or migrating data
        run: vercel rollback "$DEPLOYMENT" --yes
