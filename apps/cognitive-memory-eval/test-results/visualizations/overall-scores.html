<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>overall scores</title>
    <style>
      :root { --bg:#0f1220; --panel:#171a2b; --ink:#ecf1ff; --muted:#9fb0d9; --line:#2b3150; --blue:#3b82f6; --green:#22c55e; --red:#ef4444; --amber:#f59e0b; }
      * { box-sizing:border-box; }
      body { margin:0; font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial; background:var(--bg); color:var(--ink); }
      .wrap { max-width: 1220px; margin: 0 auto; padding: 20px; }
      h1, h2, h3 { margin: 0 0 12px; }
      a { color:#93c5fd; text-decoration:none; }
      a:hover { text-decoration:underline; }
      .muted { color:var(--muted); }
      .grid { display:grid; gap:12px; grid-template-columns: repeat(auto-fit,minmax(220px,1fr)); }
      .card { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:14px; }
      .big { font-size:28px; font-weight:700; }
      .row { display:flex; gap:8px; flex-wrap:wrap; }
      .pill { display:inline-block; border:1px solid var(--line); border-radius:999px; padding:2px 8px; font-size:12px; color:var(--muted); }
      table { width:100%; border-collapse:collapse; }
      th, td { border-bottom:1px solid var(--line); padding:8px; text-align:left; vertical-align:top; font-size:13px; }
      th { color:var(--muted); font-weight:600; }
      code, pre { background:#101426; border:1px solid var(--line); border-radius:8px; }
      pre { padding:10px; overflow:auto; }
      .ok { color:var(--green); }
      .bad { color:var(--red); }
      .warn { color:var(--amber); }
      canvas { width: 100%; height: 430px; }
      .section { margin-top: 18px; }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  </head>
  <body>
    <div class="wrap">
      <h1>overall scores</h1>
<p class="muted">scores are judge scores on 0..10 scale. 10 is best.</p>
<canvas id="c"></canvas>
    </div>
    <script>const METRICS={"at":1770882059655,"variants":{"basic":{"variant":"basic","overallScore":0,"accuracy":0,"completeness":0,"relevance":0,"byType":{"factual":0,"temporal":0,"preference":0,"inference":0},"byDifficulty":{"easy":0,"medium":0,"hard":0},"bySession":{"session1":0,"session2":0,"session3":0,"session4":0},"avgRetrievalTimeMs":549.7928571428571,"avgMemoriesRetrieved":5,"n":0},"cognitive":{"variant":"cognitive","overallScore":0,"accuracy":0,"completeness":0,"relevance":0,"byType":{"factual":0,"temporal":0,"preference":0,"inference":0},"byDifficulty":{"easy":0,"medium":0,"hard":0},"bySession":{"session1":0,"session2":0,"session3":0,"session4":0},"avgRetrievalTimeMs":61.27857142857143,"avgMemoriesRetrieved":5,"n":0}}};

const ctx = document.getElementById("c");
new Chart(ctx, {
  type: "bar",
  data: {
    labels: ["basic", "cognitive"],
    datasets: [{
      label: "overall score (0-10)",
      data: [METRICS.variants.basic.overallScore, METRICS.variants.cognitive.overallScore],
      backgroundColor: ["#6b7280", "#3b82f6"]
    }]
  },
  options: { scales: { y: { min: 0, max: 10 } } }
});
</script>
  </body>
</html>
