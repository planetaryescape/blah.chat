services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: blah-chat-postgres
    restart: unless-stopped
    ports:
      - "55432:5432"
    environment:
      POSTGRES_USER: blah
      POSTGRES_PASSWORD: blah
      POSTGRES_DB: blah_chat
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U blah -d blah_chat"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: blah-chat-redis
    restart: unless-stopped
    ports:
      - "56379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis-http:
    image: hiett/serverless-redis-http:latest
    container_name: blah-chat-redis-http
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "58079:80"
    environment:
      SRH_MODE: env
      SRH_TOKEN: dev-token
      SRH_CONNECTION_STRING: redis://redis:6379

  minio:
    image: minio/minio:RELEASE.2025-02-28T09-55-16Z
    container_name: blah-chat-minio
    restart: unless-stopped
    ports:
      - "59000:59000"
      - "59001:59001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server --address ":59000" /data --console-address ":59001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:59000/minio/health/live >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio-create-bucket:
    image: minio/mc:RELEASE.2025-02-21T16-00-46Z
    container_name: blah-chat-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      until /usr/bin/mc alias set local http://minio:59000 minioadmin minioadmin; do sleep 1; done &&
      /usr/bin/mc mb --ignore-existing local/blah-chat-dev
      "
    restart: "no"

volumes:
  postgres_data:
  redis_data:
  minio_data:
