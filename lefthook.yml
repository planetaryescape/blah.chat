# Lefthook configuration for git hooks
# Docs: https://github.com/evilmartians/lefthook

# Pre-commit: Run lint and typecheck on staged files
pre-commit:
  parallel: true
  commands:
    lint:
      glob: "*.{js,ts,cjs,mjs,jsx,tsx,json,jsonc}"
      run: bun run api-client:version:auto && bun run biome check --no-errors-on-unmatched --files-ignore-unknown=true {staged_files}
      stage_fixed: true
    typecheck:
      glob: "*.{ts,tsx}"
      run: "if command -v agent-work >/dev/null 2>&1; then agent-work run -- bun run typecheck -- --filter=@blah-chat/web --concurrency=4; else bun run typecheck -- --filter=@blah-chat/web --concurrency=4; fi"
    byod-schema-sync:
      glob: "{apps/web/src/lib/byod,packages/backend/convex/schema,packages/shared/src/byod}/**/*.ts"
      run: bun run byod:sync
      stage_fixed: true

# Validate the deployable web app, not native/mobile release artifacts.
pre-push:
  commands:
    build:
      run: "if command -v agent-work >/dev/null 2>&1; then agent-work run -- bun run build -- --filter=@blah-chat/web --concurrency=4; else bun run build -- --filter=@blah-chat/web --concurrency=4; fi"
